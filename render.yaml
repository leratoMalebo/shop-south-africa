# Render Blueprint — describes the three pieces of this app for reference.
# You don't need to apply this manually: once this repo is pushed to
# GitHub, Claude will provision these directly via the Render MCP connector.
# (Kept here so the setup is also reproducible by hand via
# https://dashboard.render.com/blueprints if preferred.)
databases:
  - name: shop-south-africa-db
    plan: free
    databaseName: shop_south_africa
    user: shop_south_africa

services:
  - type: web
    name: shop-south-africa-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shop-south-africa-db
          property: connectionString

  - type: web
    name: shop-south-africa-app
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://shop-south-africa-api.onrender.com/api
